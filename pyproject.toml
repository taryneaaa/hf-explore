[project]
name = "hf-explore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tarynea", email = "taggarwal2@babson.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
hf-explore = "hf_explore:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
